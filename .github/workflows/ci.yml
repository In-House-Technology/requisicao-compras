name: Validar app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validar origem do catálogo
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: In-House-Technology/ihapp-tools@c2113f6a1f5cb33c40eba8213a1e272227452650
        with:
          mode: app
          path: .
      - name: Validar versão, tag e commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: In-House-Technology/ihapp-tools@c2113f6a1f5cb33c40eba8213a1e272227452650
        with:
          mode: app
          path: .
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
